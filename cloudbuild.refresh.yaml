substitutions:
  _REGION: us-central1
  _REPOSITORY: finrag-repo
  _BACKEND_SERVICE: finrag-research-api
  _BACKEND_URL: https://finrag-research-api-7pj7nolpla-uc.a.run.app
  _FRONTEND_URL: https://finrag-research-7pj7nolpla-uc.a.run.app
  _TICKERS: AAPL,ADS,AMZN,COST,IBM,JNJ,JPM,LOW,META,NFLX,NVDA,TGT,TSLA,V,WMT
  _LOOKBACK_DAYS: "730"

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install --quiet --no-cache-dir -r requirements-dev.txt
        python -m ruff check backend frontend scripts tests
        python -m ruff format --check backend frontend scripts tests
        PYTHONPATH=/workspace PYTHONDONTWRITEBYTECODE=1 pytest -q -p no:cacheprovider

  - id: restore-corpus-state
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p data/raw data/processed
        if gcloud storage ls gs://$PROJECT_ID-finrag-documents/raw >/dev/null 2>&1; then
          gcloud storage rsync --recursive gs://$PROJECT_ID-finrag-documents/raw data/raw
        fi
        if gcloud storage ls gs://$PROJECT_ID-finrag-documents/state/quartr_sync_state.json >/dev/null 2>&1; then
          gcloud storage cp gs://$PROJECT_ID-finrag-documents/state/quartr_sync_state.json data/processed/quartr_sync_state.json
        fi

  - id: sync-quartr
    name: python:3.12-slim
    entrypoint: bash
    secretEnv:
      - QUARTR_API_KEY
    args:
      - -ceu
      - |
        pip install --quiet --no-cache-dir -r requirements.txt
        python scripts/sync_quartr.py --tickers "${_TICKERS}" --lookback-days "${_LOOKBACK_DAYS}"

  - id: rebuild-index
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install --quiet --no-cache-dir -r requirements.txt
        python scripts/build_index.py --all --fresh
        cd data/indexes
        python -m zipfile -c ../../chroma_index.zip chroma

  - id: publish-corpus-state
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud storage rsync --recursive data/raw gs://$PROJECT_ID-finrag-documents/raw
        gcloud storage cp data/processed/quartr_sync_state.json gs://$PROJECT_ID-finrag-documents/state/quartr_sync_state.json

  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_BACKEND_SERVICE}:$BUILD_ID
      - --file=Dockerfile.backend
      - .

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_BACKEND_SERVICE}:$BUILD_ID

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_BACKEND_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=finrag-backend@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=APP_ENV=production,AUTH_MODE=google,LLM_PROVIDER=vertexai,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=global,VERTEX_CHAT_MODEL=gemini-2.5-flash,FRONTEND_URL=${_FRONTEND_URL},FRONTEND_SERVICE_ACCOUNT=finrag-frontend@$PROJECT_ID.iam.gserviceaccount.com,BACKEND_AUDIENCE=${_BACKEND_URL},DOCUMENT_BUCKET=$PROJECT_ID-finrag-documents,DATA_MAX_AGE_HOURS=168
      - --set-secrets=OPENROUTER_API_KEY=openrouter-api-key:latest
      - --memory=1Gi
      - --cpu=1
      - --concurrency=8
      - --timeout=300
      - --min-instances=0
      - --max-instances=3
      - --startup-probe=httpGet.path=/health/ready,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=5,failureThreshold=24
      - --allow-unauthenticated
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_BACKEND_SERVICE}:$BUILD_ID

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/quartr-api-key/versions/latest
      env: QUARTR_API_KEY

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
