name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check backend scripts tests
      - name: Format check
        run: python -m ruff format --check backend scripts tests
      - name: Test
        env:
          OPENAI_API_KEY: test-only
          APP_AUTH_MODE: local
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q backend scripts tests
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Check web application
        working-directory: frontend
        run: npm run lint && npm run typecheck && npm run test && npm run build
