name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check backend frontend scripts tests
      - name: Format check
        run: python -m ruff format --check backend frontend scripts tests
      - name: Test
        env:
          OPENAI_API_KEY: test-only
          APP_AUTH_MODE: local
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q backend frontend scripts tests
